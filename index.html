<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tagalog Dictation Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #F8FAFC;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            touch-action: manipulation;
        }

        .app-container { width: 100%; max-width: 500px; }

        .header { margin-bottom: 15px; text-align: center; }
        .status-text { color: var(--primary); font-weight: 700; font-size: 18px; margin-bottom: 5px; }
        .progress-container { width: 100%; height: 12px; background: #E2E8F0; border-radius: 10px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(to right, #4F46E5, #10B981); transition: width 0.3s; }

        .vn-card {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            color: white; padding: 25px 15px; border-radius: 20px;
            font-size: 24px; font-weight: 800; text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #E2E8F0;
            font-size: 16px;
            outline: none;
            margin-bottom: 10px;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
        .ctrl-btn {
            padding: 15px; border-radius: 12px; border: none; font-weight: 700;
            color: white; font-size: 16px; cursor: pointer;
        }
        .btn-reset { background: #94A3B8; }
        .btn-speak { background: #4F46E5; }

        #message { margin-top: 15px; font-weight: 700; text-align: center; min-height: 30px; font-size: 18px; }
    </style>
</head>
<body>

<audio id="bg-music" style="display:none;"></audio>

<div class="app-container">

    <div class="selector-area">
        <!-- ĐÃ SỬA LỖI THẺ ĐÓNG SELECT TẠI ĐÂY -->
        <select id="book-select" onchange="updateLessonList()">
            <option value="">-- Chọn Sách --</option>
            <option value="Sách 02">Sách Tagalog 02</option>
            <option value="Sách 03">Sách Tagalog 03</option>
            <option value="Sách 04">Sách Tagalog 04</option>
            <option value="Sách 50">Sách 50 Chủ Đề</option>
        </select>

        <select id="lesson-select" onchange="changeLesson()" disabled>
            <option value="">-- Chọn bài học --</option>
        </select>
    </div>

    <div class="header">
        <div id="status" class="status-text">Đang tải dữ liệu...</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- Hiển thị nghĩa tiếng Việt để làm điểm tựa -->
    <div id="question-text" class="vn-card">Mời chọn bài học</div>

    <!-- Ô nhập câu trả lời của người dùng -->
    <textarea id="user-input-box" placeholder="Nghe và gõ lại câu Tagalog tại đây..." disabled
            style="width: 100%; height: 90px; font-size: 18px; font-weight: 700; border: 3px solid #6366F1; border-radius: 15px; padding: 10px; box-sizing: border-box; resize: none; outline: none; margin-bottom: 10px;"></textarea>

    <!-- Thanh đếm ngược thời gian 20 giây -->
    <div id="timer-text" style="text-align: center; color: #EF4444; font-weight: bold; font-size: 20px; margin-bottom: 10px;">Thời gian: 20s</div>

    <!-- Phần tính năng HINT (Gợi ý câu gốc) -->
    <div style="text-align: center; margin-bottom: 15px;">
        <button id="hint-btn" onclick="showHint()" style="background: #F59E0B; color: white; padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">💡 Xem Gợi Ý (Hint)</button>
        <p id="hint-text" style="display: none; color: #4B5563; font-style: italic; font-weight: 700; margin-top: 8px; font-size: 18px; background: #FEF3C7; padding: 8px; border-radius: 8px;"></p>
    </div>

    <div class="controls">
        <button class="ctrl-btn btn-reset" onclick="resetCurrent()">🔄 Xóa gõ lại</button>
        <button class="ctrl-btn btn-speak" onclick="speakCurrent()">🔊 Nghe Lại</button>
    </div>

    <div style="margin-top: 15px; text-align: center; background: #fff; padding: 10px; border-radius: 12px; border: 1px solid #ddd;">
        <div style="margin-bottom: 10px;">
            <label style="font-weight: bold; color: #4F46E5; display: block; margin-bottom: 5px;">🎵 Nhạc nền phát nền:</label>
            <select id="music-select" onchange="changeTrackManual()" style="margin-bottom: 5px;"></select>
        </div>
        <label style="font-weight: bold; color: #4F46E5;">🔊 Âm lượng:</label>
        <input type="range" id="volume-control" min="0" max="1" step="0.05" value="0.1" style="width: 100%; cursor: pointer;">
    </div>

    <div id="message"></div>
</div>

<script>
    let allData = [];
    let lessonPool = [];
    let currentItem = null;
    let startTime = 0;
    let totalInLesson = 0;
    let timerInterval = null;
    let currentCountdown = 20;

    // 1. Tải dữ liệu Excel
    async function init() {
        const files = [
            { name: 'sach_Tagalog_02.xlsx', label: 'Sách 02' },
            { name: 'sach_Tagalog_03.xlsx', label: 'Sách 03' },
            { name: 'sach_Tagalog_04.xlsx', label: 'Sách 04' },
            { name: '50_chu_de.xlsx', label: 'Sách 50' }
        ];
        
        for (let fileInfo of files) {
            try {
                const response = await fetch(fileInfo.name); 
                if (!response.ok) throw new Error("404");
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer);
                
                workbook.SheetNames.forEach(sheetName => {
                    if (sheetName.includes("Mục lục") || sheetName.includes("Sheet")) return;
                    const sheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    
                    let vnCol = 1; 
                    let tgCol = 2; 
                    let lastVN = "";
                    
                    json.forEach((row, index) => {
                        if (index === 0 || !row[tgCol]) return;
                        let vn = row[vnCol] || lastVN;
                        lastVN = vn;
                        allData.push({
                            vn: vn.toString().trim(),
                            tg: row[tgCol].toString().trim(),
                            lesson: `${fileInfo.label} • ${sheetName}`
                        });
                    });
                });
            } catch (e) { 
                console.error("Lỗi tải file:", fileInfo.name, e); 
            }
        }
        document.getElementById('status').innerText = "Đã tải xong dữ liệu. Mời chọn sách!";
    }

    // 2. Cập nhật danh sách bài học
    function updateLessonList() {
        const selectedBook = document.getElementById('book-select').value;
        const lessonSelect = document.getElementById('lesson-select');
        lessonSelect.innerHTML = '<option value="">-- Chọn bài học --</option>';
        
        if (selectedBook) {
            const filteredLessons = [...new Set(allData
                .filter(d => d.lesson.startsWith(selectedBook))
                .map(d => d.lesson)
            )].sort();

            filteredLessons.forEach(l => {
                const option = document.createElement('option');
                option.value = l;
                option.textContent = l.split('•')[1].trim(); 
                lessonSelect.appendChild(option);
            });
            lessonSelect.disabled = false;
        } else {
            lessonSelect.disabled = true;
        }
    }

    // 3. Chọn bài học
    function changeLesson() {
        const selected = document.getElementById('lesson-select').value;
        if(!selected) return;
        lessonPool = allData.filter(d => d.lesson === selected);
        totalInLesson = lessonPool.length;
        nextQuestion();
    }

    // 4. Chuyển câu hỏi & Kích hoạt đếm ngược 20s
    function nextQuestion() {
        if (lessonPool.length === 0) {
            document.getElementById('question-text').innerText = "🎉 HOÀN THÀNH!";
            document.getElementById('status').innerText = "Tất cả đã đạt bản năng!";
            document.getElementById('user-input-box').disabled = true;
            clearInterval(timerInterval);
            return;
        }

        currentItem = lessonPool[0];
        
        const inputBox = document.getElementById('user-input-box');
        inputBox.value = "";
        inputBox.disabled = false;
        inputBox.focus();
        
        document.getElementById('hint-text').style.display = "none";
        document.getElementById('hint-text').innerText = currentItem.tg; 
        document.getElementById('message').innerText = "";

        const done = totalInLesson - lessonPool.length;
        document.getElementById('status').innerText = `Đã xong: ${done}/${totalInLesson} — Còn lại: ${lessonPool.length}`;
        document.getElementById('progress-bar').style.width = (done / totalInLesson * 100) + "%";

        // Đọc từ phát âm ngay lập tức
        speak(currentItem.tg);
        
        startTime = Date.now();
        startTimer();
    }

    // 5. Bộ đếm ngược 20 giây chuẩn chỉnh
    function startTimer() {
        clearInterval(timerInterval);
        currentCountdown = 20;
        document.getElementById('timer-text').innerText = `Thời gian: ${currentCountdown}s`;
        document.getElementById('timer-text').style.color = "#EF4444";
        
        timerInterval = setInterval(() => {
            currentCountdown--;
            document.getElementById('timer-text').innerText = `Thời gian: ${currentCountdown}s`;
            
            if (currentCountdown <= 0) {
                clearInterval(timerInterval);
                document.getElementById('user-input-box').disabled = true;
                document.getElementById('timer-text').innerText = "⏱ HẾT GIỜ!";
                document.getElementById('message').innerHTML = `<span style="color:red">Hết 20s! Từ này sẽ được học lại ở cuối bài.</span>`;
                
                // Đẩy xuống cuối mảng học lại
                lessonPool.push(lessonPool.shift());
                setTimeout(nextQuestion, 2500);
            }
        }, 1000);
    }

    // Lắng nghe sự kiện gõ chữ trực tiếp
    document.getElementById('user-input-box').addEventListener('input', function(e) {
        if(!currentItem) return;
        let userText = e.target.value;
        checkAnswerDictation(userText);
    });

    // 6. Xử lý làm sạch chuỗi: Loại bỏ chấm, phẩy, kí hiệu, khoảng cách thừa
    function cleanString(str) {
        return str.toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'’]/g, "") // Xóa mọi ký tự đặc biệt
                .replace(/\s+/g, " ")                            // Thu gọn khoảng trắng thừa
                .trim();
    }

    // 7. Thuật toán Levenshtein tính độ lệch chuẩn để chấp nhận đúng từ 80% trở lên
    function getLevenshteinDistance(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1, // Thay thế
                        matrix[i][j - 1] + 1,     // Chèn
                        matrix[i - 1][j] + 1      // Xóa
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    // 8. Kiểm tra đáp án chính xác song song khi người dùng đang gõ
    function checkAnswerDictation(userText) {
        let targetClean = cleanString(currentItem.tg);
        let userClean = cleanString(userText);

        if (targetClean.length === 0) return;

        let distance = getLevenshteinDistance(userClean, targetClean);
        let maxLength = Math.max(userClean.length, targetClean.length);
        let accuracy = ((maxLength - distance) / maxLength) * 100;

        // Nếu người dùng đã gõ độ dài tương đối ổn và đạt độ chính xác từ 80% trở lên
        if (userClean.length >= targetClean.length * 0.8 && accuracy >= 80) {
            clearInterval(timerInterval); // Dừng đếm ngược ngay lập tức
            document.getElementById('user-input-box').disabled = true;
            
            let elapsed = (Date.now() - startTime) / 1000;
            document.getElementById('timer-text').innerHTML = `<span style="color: #10B981">🎉 ĐÚNG (${accuracy.toFixed(0)}%) - ${elapsed.toFixed(1)}s</span>`;
            
            // Đạt điều kiện -> Xóa câu này khỏi danh sách bài hiện tại
            lessonPool.shift();
            setTimeout(nextQuestion, 1500);
        }
    }

    // 9. Tính năng xem Hint (Gợi ý)
    function showHint() {
        const hintText = document.getElementById('hint-text');
        hintText.style.display = (hintText.style.display === "none") ? "block" : "none";
        document.getElementById('user-input-box').focus();
    }

    function resetCurrent() {
        const inputBox = document.getElementById('user-input-box');
        inputBox.value = "";
        inputBox.focus();
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const target = voices.find(v => v.lang.includes('tl-PH') || v.lang.includes('fil-PH')) 
                       || voices.find(v => v.name.includes('Google'));
        if (target) utter.voice = target;
        utter.lang = 'tl-PH';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
    }

    function speakCurrent() { if(currentItem) speak(currentItem.tg); }

    // --- QUẢN LÝ NHẠC NỀN ---
    const playlist = [
        "nhac/4k----------ost-----------------cover-by.mp3",
        "nhac/always-with-me---spirited-away-----------itsumo-nando-demo.mp3",
        "nhac/guitar--ch--tr-n-th-ng-n-m--11pkfuocpgq.mp3",
        "nhac/guitar--ph--xa--xcbp9foq6wg.mp3",
        "nhac/guitar--scraborough-fair--or98j4but-u.mp3"
    ];

    function initMusicList() {
        const musicSelect = document.getElementById('music-select');
        playlist.forEach((track, index) => {
            const option = document.createElement('option');
            option.value = index;
            let stt = (index + 1).toString().padStart(2, '0'); 
            let fileName = track.split('/').pop().replace('.mp3', '').split('-').join(' ');
            option.textContent = `${stt}. ${fileName.substring(0, 30)}...`;
            musicSelect.appendChild(option);
        });
    }

    initMusicList();

    const volumeSlider = document.getElementById('volume-control');
    const musicPlayer = document.getElementById('bg-music');
    musicPlayer.volume = 0.1; 

    volumeSlider.addEventListener('input', function() {
        musicPlayer.volume = this.value;
    });

    let currentTrack = 0;
    function playTrack(index) {
        if(playlist.length === 0) return;
        currentTrack = index;
        musicPlayer.src = playlist[currentTrack];
        musicPlayer.onloadedmetadata = function() {
            musicPlayer.currentTime = 10; 
            musicPlayer.play().catch(e => console.log("Chờ tương tác kích hoạt nhạc..."));
        };
        document.getElementById('music-select').value = currentTrack;
    }

    function changeTrackManual() {
        const selectedIndex = parseInt(document.getElementById('music-select').value);
        playTrack(selectedIndex);
    }

    function playNextTrack() {
        currentTrack = (currentTrack + 1) % playlist.length;
        playTrack(currentTrack);
    }

    musicPlayer.ontimeupdate = function() {
        if (musicPlayer.currentTime >= 40) { playNextTrack(); }
    };
    musicPlayer.onended = playNextTrack;

    document.addEventListener('click', function() {
        if (musicPlayer.paused) { playTrack(0); }
    }, { once: true });

    window.speechSynthesis.onvoiceschanged = () => {}; 
    init();
</script>
</body>
</html>
